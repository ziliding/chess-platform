name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        id: test-backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Upload test reports on failure
        if: failure() && steps.test-backend.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Lint, types and tests run inside the image's test stage, so they use the same Stockfish that ships
  analysis:
    name: Analysis service
    runs-on: ubuntu-latest

    services:
      # The worker tests talk to a real broker; the user must not be `guest`, which RabbitMQ limits to localhost
      rabbitmq:
        image: rabbitmq:4.1
        env:
          RABBITMQ_DEFAULT_USER: chess
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the test image
        run: docker build --target test --tag analysis-test analysis

      - name: Lint, type check and test
        # The contracts are shared with the backend tests and live outside the image
        run: >-
          docker run --rm --network host
          --env AMQP_TEST_URL=amqp://chess:password@localhost:5672/
          --volume "$PWD/contracts:/contracts:ro"
          analysis-test

  # Plays one full game through the gateway, so it catches breakage between services that unit tests miss
  loadtest-smoke:
    name: Load test (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the application
        run: docker compose --profile app up --detach --build --wait

      - name: Run the smoke load test
        run: docker compose --profile app --profile loadtest run --rm --build loadtest

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-report
          path: loadtest/target/gatling/
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
