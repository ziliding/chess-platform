services:
  db:
    container_name: chess-db
    hostname: db
    image: postgres:17.5
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - ./docker/volumes/postgres-dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-chessdb}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    container_name: chess-redis
    hostname: redis
    image: redis:8.6
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - ./docker/volumes/redis-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  rabbitmq:
    container_name: chess-rabbitmq
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672" # AMQP (analysis jobs)
      - "61613:61613" # STOMP
      - "15672:15672" # management UI
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chess}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # The app profile runs the whole application like production: docker compose --profile app up --build
  # Without it, only db, redis and rabbitmq start, for running the backend and frontend locally.

  # Several identical instances; logins live in Redis and WebSocket messages go through RabbitMQ,
  # so any instance can serve any request
  backend:
    profiles: [ app ]
    build:
      context: ./backend
    deploy:
      replicas: 2
    networks:
      - backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-chessdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-chess}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      APP_WEBSOCKET_RELAY_ENABLED: true
      APP_WEBSOCKET_RELAY_HOST: rabbitmq
      APP_WEBSOCKET_RELAY_PORT: 61613
      APP_WEBSOCKET_RELAY_LOGIN: ${RABBITMQ_USER:-chess}
      APP_WEBSOCKET_RELAY_PASSCODE: ${RABBITMQ_PASSWORD:-password}
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Evaluates archived games with Stockfish for the backend. Stateless: it only talks to RabbitMQ, so scale it with
  # `deploy.replicas`. The backend stays up without it; analysis requests then answer "temporarily unavailable".
  analysis:
    profiles: [ app ]
    build:
      context: ./analysis
    networks:
      - backend
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-chess}:${RABBITMQ_PASSWORD:-password}@rabbitmq:5672/
      ENGINE_DEPTH: ${ANALYSIS_ENGINE_DEPTH:-16}
    # Room for a job in progress to finish; until the worker handles SIGTERM (phase 2), a stop cancels it and
    # RabbitMQ redelivers it
    stop_grace_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    profiles: [ app ]
    container_name: chess-frontend
    hostname: frontend
    build:
      context: ./frontend
    networks:
      - frontend

  # Single entry point: / goes to the frontend, /api and /ws to the backend replicas
  gateway:
    profiles: [ app ]
    container_name: chess-gateway
    hostname: gateway
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "3000:3000" # application
      - "8080:8080" # direct backend access (API tools, Swagger UI, health)
    networks:
      - backend
      - frontend
    configs:
      - source: gateway-nginx-conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # Plays full games against the app profile and writes the HTML report to loadtest/target/gatling:
  # LOADTEST_TYPE=average docker compose --profile app --profile loadtest run --rm --build loadtest
  # Unset variables fall back to the test type's defaults (see README)
  loadtest:
    profiles: [ loadtest ]
    container_name: chess-loadtest
    hostname: loadtest
    build:
      context: ./loadtest
    networks:
      - backend
    volumes:
      - ./loadtest/target/gatling:/app/target/gatling
    environment:
      LOADTEST_TYPE: ${LOADTEST_TYPE:-}
      LOADTEST_TARGET_URL: ${LOADTEST_TARGET_URL:-http://gateway:3000}
      LOADTEST_USERS: ${LOADTEST_USERS:-}
      LOADTEST_RAMP: ${LOADTEST_RAMP:-}
      LOADTEST_DURATION: ${LOADTEST_DURATION:-}
      LOADTEST_THINK_TIME: ${LOADTEST_THINK_TIME:-}
    depends_on:
      # The gateway itself waits for healthy backends
      gateway:
        condition: service_started

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

configs:
  rabbitmq-plugins:
    content: |
      [rabbitmq_management,rabbitmq_stomp].
  gateway-nginx-conf:
    file: ./nginx.conf
