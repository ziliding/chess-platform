# Local development against the services from `docker compose up` (db, redis, rabbitmq on localhost).
# Under `docker compose --profile app`, the environment in compose.yaml overrides the connection settings.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chessdb
    username: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: chess
    password: password
  jpa:
    show-sql: true

app:
  websocket:
    relay:
      host: localhost
      port: 61613
      login: chess
      passcode: password

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: info
    me.zilid.chessplatform: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
