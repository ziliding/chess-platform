# Production-ready defaults. Profiles (e.g. dev) only override what differs; environment variables override any
# property through relaxed binding (SPRING_DATASOURCE_URL sets spring.datasource.url).
spring:
  application:
    name: chess-platform
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migrations
    validate-migration-naming: true
  rabbitmq:
    # AMQP for analysis jobs. host, port, username and password must be set (the STOMP relay below has its own)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # A result that keeps failing is dead-lettered after the retries instead of being redelivered forever
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  data:
    web:
      pageable:
        serialization-mode: via-dto
  main:
    banner-mode: "off"

server:
  servlet:
    session:
      cookie:
        # Spring Session would otherwise name it SESSION
        name: JSESSIONID

# The gateway's public server only routes /api and /ws, so actuator stays internal
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  analysis:
    # How long a requested analysis may take, queueing included, before it is failed with TIMED_OUT
    deadline: 3m
    max-queued-per-user: 3
    sweep:
      interval: 15s
  allowed-origins: http://localhost:3000,http://frontend:3000
  websocket:
    relay:
      # Required when running more than one backend instance; host, login and passcode must then be set
      enabled: true

logging:
  level:
    root: warn
    me.zilid.chessplatform: info
